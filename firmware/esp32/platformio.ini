[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/validate_config.py
lib_deps =
    adafruit/Adafruit PN532 @ 1.3.4
    bblanchon/ArduinoJson @ 7.4.2
build_flags = -DCORE_DEBUG_LEVEL=1
build_src_filter = +<main.cpp> -<i2c_diag.cpp>

[env:i2cdiag]
extends = env:esp32dev
build_src_filter = -<main.cpp> +<i2c_diag.cpp>
