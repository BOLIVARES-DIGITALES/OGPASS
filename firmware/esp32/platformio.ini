[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps =
    miguelbalboa/MFRC522@1.4.12
    bblanchon/ArduinoJson@7.4.2

[env:esp32dev]
build_flags = -DOGPASS_DEVELOPER_MODE=0

[env:esp32developer]
build_flags = -DOGPASS_DEVELOPER_MODE=1

; Explicit lab build; never enabled by default or promoted by compilation alone.
[env:ble_ibeacon]
build_flags = -DOGPASS_DEVELOPER_MODE=1 -DOGPASS_ENABLE_BLE=1

; Compile coverage for TLS/NVS paths. Invalid test config; do not upload.
[env:network_compile_test]
build_flags = -DOGPASS_DEVELOPER_MODE=1 -DOGPASS_COMPILE_NETWORK_FIXTURE=1
